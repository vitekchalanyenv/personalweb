<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Editor — Vít Chalany</title>
  </head>
  <body>
    <!--
      Sveltia CMS. The whole admin UI is this one script; there is no build
      step and nothing to install. Configuration lives next door in config.yml.

      The version is pinned to the 0.x line on purpose. Sveltia is pre-1.0, so
      breaking changes can land in minor releases — but exact-pinning would
      also mean never getting fixes. If the editor ever stops working after
      having worked, this line is the first thing to check.
    -->
    <script src="https://unpkg.com/@sveltia/cms@^0/dist/sveltia-cms.js"></script>
  </body>
</html>
